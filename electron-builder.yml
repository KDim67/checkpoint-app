appId: com.checkpoint.app
productName: Checkpoint
# baked into the exe and installer; must match LICENSE's holder and year, a test checks
copyright: "Copyright © 2026 Dimitrios Koutsompinas"

# public repo, so no token ships; publishing needs GH_TOKEN at build time and a version bump
publish:
  provider: github
  owner: KDim67
  repo: checkpoint-app
  releaseType: release

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - resources/**/*
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/test{s,}/**"
  - "!**/__tests__/**"
  - "!**/*.{spec,test}.{js,ts}"
  - "!**/node_modules/.cache"

# native .node binaries stay unpacked so the OS can load them
asar: true
asarUnpack:
  - "**/*.node"

# 55 locale .paks (41 MB) and no translations; chromium falls back to en-US
electronLanguages:
  - en-US

# smallest installer, slower build
compression: maximum

# no spaces: latest.yml has to match the name GitHub gives the asset or updates fail
artifactName: ${name}-${version}-${os}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  # unsigned trips SmartScreen; sign via CSC_LINK / CSC_KEY_PASSWORD env, not keys here
  # certificateFile: certs/cert.p12
  # certificatePassword: ${env.WIN_CERT_PASSWORD}
  requestedExecutionLevel: asInvoker  # never ask for admin

nsis:
  # one click, no wizard; per-user is what makes losing the directory choice acceptable
  oneClick: true

  # %LOCALAPPDATA%\Programs, so never a UAC prompt
  perMachine: false

  # no final wizard page for a launch tick, so this is the only auto-open
  runAfterFinish: true

  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Checkpoint"

  # in one-click mode the header icon is the installer's whole face
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico

  deleteAppDataOnUninstall: false         # keep user data

  installerLanguages:
    - en_US

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  category: public.app-category.developer-tools
  # uncomment to sign and notarise:
  # identity: "Developer ID Application: Your Name (TEAM_ID)"
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # entitlementsInherit: build/entitlements.mac.plist

dmg:
  background: null
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/icon.png
  category: Development
  synopsis: "Local-first desktop workspace for keeping track of what you're doing"
  description: "A local-first desktop workspace for keeping track of what you're doing."
