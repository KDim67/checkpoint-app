appId: com.checkpoint.app
productName: Checkpoint
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - resources/**/*
win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.ico
mac:
  target:
    - target: dmg
      arch: x64
  icon: resources/icon.png
linux:
  target:
    - target: AppImage
      arch: x64
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
asar: true
asarUnpack:
  - "**/*.node"
