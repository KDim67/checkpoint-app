name: Bug report
description: Something in Checkpoint does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The quickest way in is **Report a problem**, in Ctrl+K or under Settings,
        then About. It fills in the version, the system and the app's recent
        errors for you to read first.

        One thing before you send: **check what is on screen**. A screenshot of
        Checkpoint shows real note titles, task names and workspace names, and
        this is a public repository.

  - type: input
    id: version
    attributes:
      label: Checkpoint version
      description: Settings, then About.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Leave this blank if it only happens now and then.
      value: |
        1.
        2.
        3.

  - type: textarea
    id: console
    attributes:
      label: Recent errors
      description: >
        Report a problem fills this in from the app log, and Show App Log in
        About opens the whole file. Optional, but it is often the whole answer.
      render: text
