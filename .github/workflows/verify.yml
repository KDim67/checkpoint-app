name: verify

on:
  push:
    branches: [main]
  pull_request:

# a new push cancels the run still going
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # windows only, it's what ships; the other builder targets are untested ground
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # node:sqlite's backup() needs 24, same as engines.node
          node-version: 24
          cache: npm

      # exact lockfile install; skip scripts, no check needs the ABI rebuild and npm 11 would prompt
      - name: Install
        run: npm ci --ignore-scripts

      # the whole tree, since vite bundles devDependencies like mermaid into what ships
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # typecheck, lint, tests, build: what contributors run before a PR
      - name: Verify
        run: npm run verify
